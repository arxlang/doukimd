<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} · {{ site.title }}</title>
    <link rel="stylesheet" href="{{ stylesheet }}">
  </head>
  <body>
    <header>{{ site.title }} <span>{{ project.version }}</span></header>
    <div class="layout">
      <nav aria-label="Documentation">
        {% for item in navigation %}
        <a href="{{ item.url }}"{% if item.title == page.title %} aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
      <main>
        <h1>{{ page.title }}</h1>
        {{ content | safe }}
      </main>
    </div>
    <footer>Built with DoukiMD</footer>
  </body>
</html>
