[project]
name = "doukimd"
version = "1.1.0"  # semantic-release
description = "Markdown documentation with first-class Douki API references"
readme = "README.md"
authors = [{name = "Ivan Ogasawara", email = "ivan.ogasawara@gmail.com"}]
license = "BSD-3-Clause"
requires-python = ">=3.10,<4"
dependencies = [
  "atpublic>=5,<6",
  "click>=8.1,<9",
  "douki>=0.12.1,<0.13",
  "griffe>=1.15,<2",
  "Jinja2>=3.1.6,<4",
  "jsonschema>=4.23,<5",
  "markdown-it-py>=3,<5",
  "mdit-py-plugins>=0.4,<0.7",
  "nbformat>=5.11,<6",
  "pluggy>=1.5,<2",
  "plum-dispatch>=2.5,<3",
  "pydantic>=2.10,<3",
  "Pygments>=2.18,<3",
  "PyYAML>=6,<7",
  "typeguard>=4.4,<5",
]

[project.scripts]
doukimd = "doukimd.cli:main"

[build-system]
requires = ["poetry-core>=2,<3"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "doukimd", from = "src"}]
include = ["src/doukimd/py.typed", "src/doukimd/themes/**/*"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
pytest-cov = ">=5,<8"
pre-commit = ">=3.8,<5"
ruff = ">=0.9,<0.18"
mypy = ">=1.14,<3"
types-pyyaml = ">=6"
types-jsonschema = ">=4"
types-Pygments = ">=2"
makim = "1.27.0"
bandit = ">=1.8,<2"
vulture = ">=2.14,<3"
mccabe = ">=0.7,<0.8"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
files = ["src/doukimd"]

[[tool.mypy.overrides]]
module = ["doukimd.api", "doukimd.collection", "doukimd.notebook_rendering"]
disable_error_code = ["no-redef"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:xonsh"

[tool.coverage.run]
source = ["doukimd"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
target-version = "py310"
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "YTT", "RUF", "I", "UP006", "UP007"]

[tool.ruff.lint.isort]
lines-between-types = 1

[tool.ruff.lint.per-file-ignores]
"src/doukimd/api.py" = ["F811"]
"src/doukimd/collection.py" = ["F811"]
"src/doukimd/notebook_rendering.py" = ["F811"]

[tool.ruff.format]
quote-style = "single"

[tool.bandit]
exclude_dirs = ["tests"]

[tool.vulture]
paths = ["src/doukimd"]
min_confidence = 80
ignore_decorators = ["@hookimpl", "@hookspec"]

[tool.douki]
exclude = ["tests/fixtures/*"]
