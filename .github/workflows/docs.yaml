name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install poetry==2.2.1
      - run: poetry install
      - run: poetry run makim docs.build
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: build/
          include-hidden-files: true
