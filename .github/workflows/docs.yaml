name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install poetry==2.2.1
      - run: poetry install
      - run: poetry run makim docs.build
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: build/
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: documentation
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'arxlang/doukimd' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: documentation-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: documentation
          path: build/
      - name: Verify the documentation entry point
        run: test -f build/index.html
      - name: Publish documentation to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
