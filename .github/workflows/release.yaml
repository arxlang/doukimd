name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'arxlang/doukimd' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install poetry==2.2.1
      - run: poetry install
      - run: poetry run makim tests.unit
      - run: poetry run makim docs.build
      - name: Configure package publication
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: poetry config pypi-token.pypi "$PYPI_TOKEN"
      - name: Publish semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: poetry run makim release.ci
