name: Release

on:
  workflow_dispatch:
    inputs:
      resume_tag:
        description: Existing stable tag to finish publishing after a failed release
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'arxlang/doukimd' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source_ref: ${{ steps.release.outputs.source_ref || steps.resume.outputs.source_ref }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install poetry==2.2.1
      - run: poetry install
      - run: poetry run makim tests.unit
      - name: Retry failed release notes pushes
        run: |
          echo "DOUKIMD_RELEASE_GIT=$(command -v git)" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.github/scripts/release-bin" >> "$GITHUB_PATH"
      - name: Configure package publication
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: poetry config pypi-token.pypi "$PYPI_TOKEN"
      - name: Publish semantic release
        if: inputs.resume_tag == ''
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: poetry run makim release.ci
      - name: Resume publication of an existing release tag
        if: inputs.resume_tag != ''
        id: resume
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUME_TAG: ${{ inputs.resume_tag }}
        run: bash .github/scripts/resume-release.sh "$RESUME_TAG"

  documentation:
    needs: release
    if: needs.release.outputs.source_ref != ''
    permissions:
      contents: write
    uses: ./.github/workflows/docs.yaml
    with:
      source_ref: ${{ needs.release.outputs.source_ref }}
